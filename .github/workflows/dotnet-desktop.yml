name: Build and Release MedReminder

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build Windows Release
    runs-on: windows-latest

    steps:
      # Check out the repository
      - name: Checkout
        uses: actions/checkout@v4

      # Install .NET 10
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Restore the NuGet packages
      - name: Restore
        run: dotnet restore MedReminder.sln

      # Build and publish the WinForms application.
      #
      # --self-contained true:
      # bundles the .NET runtime inside the application, so the user
      # does not need to install .NET 10 separately.
      #
      # -r win-x64:
      # produces a build targeting 64-bit Windows.
      - name: Publish
        run: >
          dotnet publish
          src/MedReminder.UI/MedReminder.UI.csproj
          -c Release
          -r win-x64
          --self-contained true
          -o publish

      # Create the ZIP of the published output
      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path publish\* `
            -DestinationPath MedReminder-win-x64.zip

      # Create the GitHub Release and attach the ZIP
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: MedReminder-win-x64.zip
          generate_release_notes: true
