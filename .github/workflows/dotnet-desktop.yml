name: Build and Release MedReminder

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build Windows Release
    runs-on: windows-latest

    steps:
      # Download the repository
      - name: Checkout
        uses: actions/checkout@v4

      # Install .NET 10
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Restore packages
      - name: Restore
        shell: pwsh
        run: |
          dotnet restore MedReminder.sln
          dotnet restore packaging/wix/MedReminder.wixproj

      # Build and publish the WinForms application. 
      #
      # --self-contained true:
      # includes the .NET runtime in the application,
      # so the user does not need to install .NET 10.
      #
      # -r win-x64:
      # creates a version for 64-bit Windows.      
      - name: Publish
        run: >
          dotnet publish
          src/MedReminder.UI/MedReminder.UI.csproj
          -c Release
          -r win-x64
          --self-contained true
          -o publish

      # Crea lo ZIP della versione pubblicata
      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path publish\* `
            -DestinationPath MedReminder-win-x64.zip

      # Create the WiX MSI installer using the same self-contained publish
      # output distributed in the ZIP. The release tag (vX.Y.Z) determines the
      # MSI version, ensuring upgrades correctly recognize the release.
      - name: Build MSI
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Il tag di release deve avere il formato vX.Y.Z; ricevuto: $env:GITHUB_REF_NAME"
          }

          $publishDir = (Resolve-Path publish).Path
          dotnet build packaging/wix/MedReminder.wixproj -c Release `
            /p:PublishDir="$publishDir" `
            /p:ProductVersion=$version
          if ($LASTEXITCODE -ne 0) { throw 'Build MSI fallita.' }

          $msi = "packaging/wix/bin/Release/MedReminder-$version-x64.msi"
          if (-not (Test-Path $msi)) { throw "MSI non generato: $msi" }
          Copy-Item $msi 'MedReminder-win-x64.msi'

      # Create the GitHub release and attach the ZIP and MSI.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            MedReminder-win-x64.zip
            MedReminder-win-x64.msi
          generate_release_notes: true
