name: Catalogue feed script tests

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/fixtures/catalogue/**'
      - '.github/workflows/scripts_tests.yaml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/fixtures/catalogue/**'
      - '.github/workflows/scripts_tests.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 openpyxl pytest

      - name: Run tests
        run: |
          python -m pytest scripts/feeds/tests -q
