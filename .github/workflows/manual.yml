name: AEMPS download probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    env:
      XLS_URL: https://listadomedicamentos.aemps.gob.es/Medicamentos.xls
      REST_URL: https://cima.aemps.es/cima/rest/medicamentos?pagina=1
      UA: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"

    steps:
      - name: 1 - HEAD, curl default User-Agent (previous test)
        run: |
          curl -sS -I "$XLS_URL" | head -5 || true

      - name: 2 - GET, curl default User-Agent
        run: |
          curl -sS -o body2.bin -w 'status=%{http_code} type=%{content_type} bytes=%{size_download}\n' "$XLS_URL" || true

      - name: 3 - GET, browser User-Agent and headers
        run: |
          curl -sS -L -o Medicamentos.xls \
            -w 'status=%{http_code} type=%{content_type} bytes=%{size_download} final=%{url_effective}\n' \
            -A "$UA" \
            -H 'Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8' \
            -H 'Accept-Language: es-ES,es;q=0.9,en;q=0.8' \
            -H 'Referer: https://cima.aemps.es/' \
            "$XLS_URL" || true

      - name: 4 - What was downloaded (magic bytes)
        run: |
          if [ -s Medicamentos.xls ]; then
            echo "First 8 bytes:"; head -c 8 Medicamentos.xls | xxd
            case "$(head -c 4 Medicamentos.xls | xxd -p)" in
              504b0304) echo "ZIP container: XLSX, as expected" ;;
              d0cf11e0) echo "OLE2: legacy BIFF .xls" ;;
              *)        echo "Neither: probably an HTML error page"; head -c 600 Medicamentos.xls; echo ;;
            esac
          else
            echo "Nothing downloaded"
          fi

      - name: 5 - XLSX sheet list and header row
        run: |
          if [ "$(head -c 4 Medicamentos.xls 2>/dev/null | xxd -p)" = "504b0304" ]; then
            cp Medicamentos.xls aemps.xlsx   # openpyxl checks the extension, not the content
            pip install -q openpyxl
            python - <<'EOF'
          import openpyxl
          wb = openpyxl.load_workbook("aemps.xlsx", read_only=True)
          print("Sheets:", wb.sheetnames)
          ws = wb.worksheets[0]
          rows = ws.iter_rows(values_only=True)
          print("Header:", next(rows))
          print("Data rows:", sum(1 for _ in rows))
          EOF
          else
            echo "Skipped: not an XLSX"
          fi

      - name: 6 - CIMA REST API (fallback source)
        run: |
          curl -sS -o rest.json -w 'status=%{http_code} type=%{content_type} bytes=%{size_download}\n' \
            -A "$UA" -H 'Accept: application/json' "$REST_URL" || true
          head -c 400 rest.json 2>/dev/null; echo

      - name: 7 - 403 body, if any (protection page hints)
        run: |
          for f in body2.bin Medicamentos.xls; do
            if [ -s "$f" ] && ! [ "$(head -c 4 "$f" | xxd -p)" = "504b0304" ]; then
              echo "== $f"; head -c 800 "$f"; echo
            fi
          done
