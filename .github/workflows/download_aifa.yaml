name: Download AIFA CSV

on:
  schedule:
    # On each day: a run that fails because AIFA is
    # down is retried a day later. Once the month's version is
    # published, scripts/feeds/aifa.py exits without changes. Minute 7,
    # not 0: GitHub delays or drops scheduled runs at the top of the hour
    # under load (none of the 2 October 2026 runs started).
    - cron: '7 3 * * 0'
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild and republish this month even if already published (clients re-import it at next start)'
        type: boolean
        default: false

permissions:
  contents: write

# One run of this feed at a time. Feeds run concurrently with each
# other: each publishes only its own paths, and feeds_branch.sh rebuilds
# a publish whose lease was lost. A shared group would let a queued run
# of one feed cancel the queued run of another.
concurrency:
  group: feed-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Load the published feeds
        # The feeds branch is the published state: the script decides
        # what is new against it, not against main.
        run: |
          bash scripts/feeds/feeds_branch.sh load

      - name: Generate files
        env:
          FORCE_REFRESH: ${{ inputs.force }}
        run: |
          python scripts/feeds/aifa.py

      - name: Publish to the feeds branch
        # A run dispatched from another branch must not replace what
        # clients download.
        if: github.ref_name == github.event.repository.default_branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          bash scripts/feeds/feeds_branch.sh publish "AIFA database update $(date -u +%Y%m)" \
            "data/it" ":(exclude)data/it/shortages" ":(exclude)data/it/equivalents"

      - name: Mirror to main
        # Releases up to v2.12.1 read the feeds from main/data/. Set the
        # repository variable FEEDS_MAIN_MIRROR to 'false' once they are
        # out of use (docs/CATALOGUE-DATA.md §1.1).
        if: vars.FEEDS_MAIN_MIRROR != 'false'
        run: |
          # The shortage and equivalents feeds own their subfolders.
          git add -- data/it/ ':(exclude)data/it/shortages' ':(exclude)data/it/equivalents'
          git diff --staged --quiet && exit 0
          git commit -m "AIFA database update $(date -u +%Y%m)"

          # Another push may have landed since the checkout: rebase once
          # and retry once.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push || { git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push; }
