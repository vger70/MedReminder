name: Download AIFA CSV

on:
  schedule:
    - cron: "0 3 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-pages:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate ZIP
        run: |
          python scripts/download_aifa.py

      - name: Prepare Pages Branch
        run: |
          ZIP_FILE=$(ls aifa-*.zip | head -1)

          git fetch origin gh-pages || true

          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git checkout gh-pages
          else
            git checkout --orphan gh-pages
            rm -rf .
          fi

          cp ../$ZIP_FILE . 2>/dev/null || true

      - name: Copy ZIP
        run: |
          ZIP_FILE=$(find .. -maxdepth 1 -name "aifa-*.zip" | head -1)
          cp "$ZIP_FILE" .

      - name: Create index page
        run: |
          ZIP_FILE=$(ls aifa-*.zip | head -1)

          cat > index.html <<EOF
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>AIFA Downloads</title>
          </head>
          <body>
            <h1>AIFA Downloads</h1>
            <p><a href="$ZIP_FILE</a></p>
          </body>
          </html>
          EOF

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          git diff --cached --quiet || \
          git commit -m "Update AIFA ZIP"

          git push origin gh-pages