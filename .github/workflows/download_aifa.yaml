name: Download AIFA CSV

on:
  schedule:
    # Daily from the 2nd to the 7th: a run that fails because AIFA is
    # down is retried the next day. Once the month's version is
    # published, scripts/download_aifa.py exits without changes.
    - cron: '0 3 2-7 * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild even if this month is already published (clients that already imported it will not re-import it)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Generate files
        env:
          FORCE_REFRESH: ${{ inputs.force }}
        run: |
          python scripts/download_aifa.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          git diff --staged --quiet || git commit -m "AIFA database update $(date +%Y%m)"

          git push
