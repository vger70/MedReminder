name: Download AIFA equivalent medicines list

on:
  schedule:
    # Daily: AIFA publishes the transparency list monthly, around the
    # 15th, on no fixed day. A new list is on the feed within a day;
    # clients check the feed once a day, so they show it within about
    # two days. The version is the list date AIFA writes in the price
    # column. The run first asks AIFA whether the file changed (ETag /
    # Last-Modified); a list already published, or older than it, is
    # not published.
    - cron: '41 4 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Republish the current list even if already published'
        type: boolean
        default: false

permissions:
  contents: write

# One run of this feed at a time. Feeds run concurrently with each
# other: each publishes only its own paths, and feeds_branch.sh rebuilds
# a publish whose lease was lost. A shared group would let a queued run
# of one feed cancel the queued run of another.
concurrency:
  group: feed-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Load the published feeds
        # The feeds branch is the published state: the script decides
        # what is new against it, not against main.
        run: |
          bash scripts/feeds/feeds_branch.sh load

      - name: Generate files
        env:
          FORCE_REFRESH: ${{ inputs.force }}
        run: |
          python scripts/feeds/aifa_equivalents.py

      - name: Publish to the feeds branch
        # A run dispatched from another branch must not replace what
        # clients download. No mirror to main: only releases that read
        # the feeds branch know this feed (docs/CATALOGUE-DATA.md §1.1).
        if: github.ref_name == github.event.repository.default_branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          bash scripts/feeds/feeds_branch.sh publish "AIFA equivalent medicines list update $(date -u +%Y%m%d)" \
            "data/it/equivalents"
