name: Download AIFA shortage list

on:
  schedule:
    # Daily: AIFA updates the list several times a month on no fixed
    # day, so a new list reaches clients within a day. The version is
    # the list date AIFA writes in the file; a run on a list already
    # published exits without changes and commits nothing. 04:27, after
    # the catalogue feeds, which share the concurrency group.
    - cron: '27 4 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Republish the current list even if already published'
        type: boolean
        default: false

permissions:
  contents: write

# Every feed workflow pushes to the feeds branch and main: one at a time.
concurrency:
  group: catalogue-feeds-publish
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Load the published feeds
        # The feeds branch is the published state: the script decides
        # what is new against it, not against main.
        run: |
          bash scripts/feeds/feeds_branch.sh load

      - name: Generate files
        env:
          FORCE_REFRESH: ${{ inputs.force }}
        run: |
          python scripts/feeds/aifa_shortages.py

      - name: Publish to the feeds branch
        # A run dispatched from another branch must not replace what
        # clients download.
        if: github.ref_name == github.event.repository.default_branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          bash scripts/feeds/feeds_branch.sh publish "AIFA shortage list update $(date -u +%Y%m%d)"

      - name: Mirror to main
        # Releases up to v2.12.1 read the feeds from main/data/. Set the
        # repository variable FEEDS_MAIN_MIRROR to 'false' once they are
        # out of use (docs/CATALOGUE-DATA.md §1.1).
        if: vars.FEEDS_MAIN_MIRROR != 'false'
        run: |
          git add data/it/shortages/
          git diff --staged --quiet && exit 0
          git commit -m "AIFA shortage list update $(date -u +%Y%m%d)"

          # Another push may have landed since the checkout: rebase once
          # and retry once.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push || { git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push; }
